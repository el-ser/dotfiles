# NOTE: KEYMAPS
# set leader key Control + a
set -g prefix C-a

# resizing pane
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 1j
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# rebind split window 
bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# rebind for easy pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# swapping windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# keep current path
bind c new-window -c "#{pane_current_path}"

# toggle windows and session
bind Space last-window
bind C-Space switch-client -l

# bind leader + r to refresh
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded"

# bind leader w to choose window
bind-key w run-shell "tmux choose-tree -Zw -f '##{==:##{session_name},#{session_name}}'"
