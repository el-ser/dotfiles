include ./theme.conf
# vim:fileencoding=utf-8:foldmethod=marker

# CURSOR
cursor_trail 3
# cursor_trail_decay 0.1 0.4

# FONTS
font_family      FiraMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto 

font_size 13.0
adjust_line_height 8

# BACKGROUND CONFIG - Solarized Osaka 
background_opacity 0.92
background_blur 5
#background #00141A
background #000E12

# BACKGROUND CONFIG - Transparent Black Background 
# background_opacity 0.8
# background_blur 20
# background #000000

# BACKGROUND CONFIG 2 
# background_image ~/Pictures/Background/gunita-tree.png
# background_image_layout scaled
# background_tint 0.96

# MAPPINGS
map cmd+[ previous_tab
map cmd+] next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+enter launch --cwd=current
map ctrl+shift+enter launch --cwd=current
map cmd+t new_tab_with_cwd 
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback /run/current-system/sw/bin/fzf --no-sort --no-mouse --exact -i
# map f1 set_tab_title

# FULL SCREEN
# macos_traditional_fullscreen yes

# TAB
tab_bar_edge bottom
tab_bar_margin_width      9
tab_bar_margin_height     9 0
# hidding tab for tmux
# tab_bar_style             separator
tab_bar_style             hidden 
tab_bar_min_tabs          1
tab_separator             ""
tab_title_template        "{fmt.fg._5c6370}{fmt.bg.default}{fmt.fg._abb2bf}{fmt.bg._5c6370} {title[:15] + (title[15:] and '…')} ⌘ {index}{fmt.fg._5c6370}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._f0f0f0}{fmt.bg.default}{fmt.fg._282c34}{fmt.bg._f0f0f0} {fmt.noitalic}{title[:40] + (title[40:] and '…')} ⌘ {index}{fmt.fg._f0f0f0}{fmt.bg.default} "

# WINDOW
window_margin_width 5
window_padding_width 0
window_border_width 3
single_window_margin_width 0
active_border_color #2e1d70
inactive_border_color #0f0926
hide_window_decorations titlebar-only
enabled_layouts Tall, *
tab_bar_align center
